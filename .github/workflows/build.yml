
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show repository files
        run: find . -maxdepth 2 -name "*.sh" -o -name "Fastfile" -o -name "*.py"
