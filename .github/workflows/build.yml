
name: Build Loop via Fastlane

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout LoopWorkspace
        uses: actions/checkout@v4
        with:
          repository: 'LoopKit/LoopWorkspace'
          token: ${{ secrets.GH_PAT }}
          submodules: 'recursive'
          path: 'Loop'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4.0'

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: 'Loop'

      - name: Run Fastlane Build
        working-directory: 'Loop'
        run: |
          # Versucht, Fastlane über Bundler oder direkt auszuführen
          if [ -f "Gemfile" ]; then
            bundle exec fastlane build || bundle exec fastlane release
          else
            fastlane build
          fi
