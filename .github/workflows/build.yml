
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup project team
        run: bundle exec fastlane update_project_team
        working-directory: 'fastlane'

      - name: Run Fastlane Build
        run: bundle exec fastlane build
        working-directory: 'fastlane'
