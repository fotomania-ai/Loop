
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Loop Main App Only
        run: xcodebuild -project Loop.xcodeproj -scheme Loop -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 15" clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO -derivedDataPath DerivedData

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loop-App
          path: DerivedData/Build/Products/Debug-iphonesimulator/Loop.app
