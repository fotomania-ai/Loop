
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Find Xcode project
        run: find . -name "*.xcodeproj"

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app
