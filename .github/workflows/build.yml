
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout LoopWorkspace
        uses: actions/checkout@v4
        with:
          repository: 'LoopKit/LoopWorkspace'
          token: ${{ secrets.GH_PAT }}
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build Loop App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Starting Loop build process..."
          ./scripts/bootstrap.sh
          xcodebuild -project Loop.xcodeproj -scheme "Loop (Generic)" -sdk iphoneos -configuration Release archive -archivePath $PWD/build/Loop.xcarchive
