


name: Build Loop

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build Loop App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Starting Loop build process..."
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/LoopKit/LoopWorkspace.git Loop
          cd Loop
          git submodule update --init --recursive
          ./scripters/bootstrap.sh
          xcodebuild -project Loop.xcodeproj -scheme "Loop (Generic)" -sdk iphoneos -configuration Release archive -archivePath $PWD/build/Loop.xcarchive
