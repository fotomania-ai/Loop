
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout LoopWorkspace
        uses: actions/checkout@v4
        with:
          repository: 'LoopKit/LoopWorkspace'
          token: ${{ secrets.GH_PAT }}
          submodules: 'recursive'
          path: 'Loop'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Archive Loop Workspace without SDK restriction
        run: |
          cd Loop
          echo "Creating archive with correct multi-platform support..."
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme Loop -archivePath ./build/Loop.xcarchive archive CODE_SIGNING_ALLOWED=NO
