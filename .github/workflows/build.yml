
name: Build Loop via Fastlane

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout LoopWorkspace
        uses: actions/checkout@v4
        with:
          repository: 'LoopKit/LoopWorkspace'
          token: ${{ secrets.GH_PAT }}
          submodules: 'recursive'
          path: '.'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4.0'

      - name: Set up Ruby & Dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Bundler and Update Fastlane
        run: |
          gem install bundler
          bundle config set --local frozen 'false'
          bundle update fastlane

      - name: Run Fastlane Build
        run: |
          bundle exec fastlane ios build_loop
