
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane

      - name: Setup project team
        working-directory: fastlane
        run: bundle exec fastlane update_project_team

      - name: Run Fastlane Build
        working-directory: fastlane
        run: bundle exec fastlane build
