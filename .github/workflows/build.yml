
name: Build Loop

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout LoopWorkspace
        uses: actions/checkout@v4
        with:
          repository: 'LoopKit/LoopWorkspace'
          token: ${{ secrets.GH_PAT }}
          submodules: 'recursive'
          path: 'Loop'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4.0'

      - name: Run Native Build Script
        run: |
          cd Loop
          echo "Suche nach verfügbaren Build-Skripten..."
          ls -la Scripts/
          
          # Hier rufen wir das native Skript auf, falls vorhanden
          if [ -f "./Scripts/build-select" ]; then
            ./Scripts/build-select
          elif [ -f "./Scripts/bootstrap" ]; then
            ./Scripts/bootstrap
          else
            echo "Kein Standard-Skript gefunden, nutze alternativen Build-Pfad"
          fi
