name: Build Loop

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build Loop App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Starting full Loop build process..."
          xcodebuild -version
          # Hier folgen im nächsten Schritt die Build-Skripte für Loop
